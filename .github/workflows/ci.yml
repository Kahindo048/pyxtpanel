# Continuous integration (A.1.5, J.1.3): quality gates, the test suite on a matrix of systems, Python
# and library versions, and the package build.  No Stata is needed: the Stata results are frozen in
# tests/golden (the tests that run Stata skip themselves when it is absent).
#
# The same file is called by release.yml, so a version is never published from a red build.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Quality (ruff, mypy, import-linter, generated files)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: mypy (strict, src/pyxtpanel)
        run: mypy
      - name: import-linter (layers)
        run: lint-imports
      - name: generated files are current
        run: |
          python -m tools.manifest_tables --check
          python -m tools.doc --check

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }}, ${{ matrix.deps }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        deps: [latest]
        include:
          # pandas 2.x, the last release before 3.0 (on Python 3.10 "latest" is already 2.x)
          - {os: ubuntu-latest, python: "3.12", deps: pandas2}
          # the oldest versions pyproject.toml promises, without matplotlib (the minimal install)
          - {os: ubuntu-latest, python: "3.10", deps: minimum}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (latest releases, with the plot extra)
        if: matrix.deps == 'latest'
        run: pip install -e ".[plot]" pytest hypothesis pytest-cov
      - name: Install (pandas 2.x)
        if: matrix.deps == 'pandas2'
        run: pip install -e ".[plot]" "pandas<3" pytest hypothesis
      - name: Install (minimum versions, no matplotlib)
        if: matrix.deps == 'minimum'
        run: pip install -e . "numpy==1.24.*" "pandas==2.0.*" "scipy==1.10.*" pytest hypothesis
      - name: Versions
        run: python -c "import numpy, pandas, scipy; print('numpy', numpy.__version__, 'pandas', pandas.__version__, 'scipy', scipy.__version__)"
      - name: Tests with coverage (lines and branches, at least 90 %)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && matrix.deps == 'latest'
        run: python -m pytest -q --cov=pyxtpanel --cov-branch --cov-report=term:skip-covered
      - name: Tests
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && matrix.deps == 'latest') }}
        run: python -m pytest -q

  build:
    name: Build and install the package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install the wheel alone in a fresh environment and run the smoke test
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean/bin/python" -I "$GITHUB_WORKSPACE/tools/smoke_install.py"
